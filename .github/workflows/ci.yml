name: Build, Test and Push PayPal SMB Churn Image

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: paypal-smb-churn-api

jobs:
  build-test-push:
    name: Test, Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT CODE
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 4. RUN DATA VALIDATION (Great Expectations gate)
      # ============================================================
      - name: Run data validation
        run: |
          python src/utils/validate_data.py

      # ============================================================
      # 5. RUN AUTOMATED TESTS
      # ============================================================
      - name: Run tests
        env:
          CHURN_API_KEY: dev-local-key-change-me
        run: |
          pytest tests/ -v

      # ============================================================
      # 6. RUN ML PIPELINE (preprocess -> features -> train -> tune)
      # ============================================================
      - name: Run preprocessing and feature engineering
        run: |
          python -m src.data.preprocess
          python -m src.features.build_features

      - name: Train baseline model
        run: |
          python -m src.models.train

      - name: Tune model (produces production candidate)
        env:
          MLFLOW_DB_HOST: ${{ secrets.MLFLOW_DB_HOST }}
          MLFLOW_DB_PORT: ${{ secrets.MLFLOW_DB_PORT }}
          MLFLOW_DB_NAME: ${{ secrets.MLFLOW_DB_NAME }}
          MLFLOW_DB_USER: ${{ secrets.MLFLOW_DB_USER }}
          MLFLOW_DB_PASSWORD: ${{ secrets.MLFLOW_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET_NAME: paypal-smb-churn-ml
        run: |
          python -m src.models.tune
          
          
      # ============================================================
      # 7. MODEL QUALITY GATE
      # ============================================================
      - name: Run model quality gate
        run: |
          python scripts/model_quality_gate.py

      # ============================================================
      # 8. CONFIGURE AWS CREDENTIALS
      # ============================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================================
      # 9. LOGIN TO AMAZON ECR
      # ============================================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================================
      # 10. SETUP DOCKER BUILDX
      # ============================================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # 11. BUILD AND PUSH DOCKER IMAGE TO ECR
      # ============================================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ============================================================
      # 12. FORCE ECS SERVICE TO DEPLOY THE NEW IMAGE
      # ============================================================
      - name: Deploy new image to ECS
        run: |
          aws ecs update-service \
            --cluster paypal-smb-churn-cluster \
            --service paypal-smb-churn-api-service \
            --force-new-deployment \
            --region us-east-1
      # ============================================================
      # 13. VALIDATE ALL REQUIREMENTS FILES INSTALL CLEANLY
      # ============================================================
      - name: Validate requirements-docker.txt installs cleanly
        run: |
          python -m venv /tmp/venv-docker
          /tmp/venv-docker/bin/pip install --upgrade pip
          /tmp/venv-docker/bin/pip install -r requirements-docker.txt

      - name: Validate requirements-dashboard.txt installs cleanly
        run: |
          python -m venv /tmp/venv-dashboard
          /tmp/venv-dashboard/bin/pip install --upgrade pip
          /tmp/venv-dashboard/bin/pip install -r requirements-dashboard.txt